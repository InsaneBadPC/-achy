name: Sestavit Android APK a Vytvořit Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Sestavení nativního APK s automatickým navýšením verze
    runs-on: ubuntu-latest

    steps:
      - name: 1. Stažení zdrojového kódu
        uses: actions/checkout@v4

      - name: 2. Nastavení Node.js (LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Nastavení Java (JDK 21 - Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Automatické přijetí licencí a příprava Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
        continue-on-error: true

      - name: 5. Automatické navýšení verze pro každé sestavení
        run: |
          BUILD_NUM=$(( ${{ github.run_number }} + 5 ))
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "Sestavuji verzi: $VERSION_NAME (build $BUILD_NUM)"
          
          # Aktualizace verze v Android konfiguraci
          sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUM}/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle
          
          # Aktualizace výchozí konstanty v updateService.ts
          sed -i "s/CURRENT_APP_VERSION = '[^']*'/CURRENT_APP_VERSION = '${VERSION_NAME}'/g" src/services/updateService.ts

          # Vytvoření souboru version.json pro automatickou detekci v aplikaci
          cat <<EOF > public/version.json
          {
            "version": "${VERSION_NAME}",
            "build": ${BUILD_NUM},
            "repository": "${{ github.repository }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: 6. Instalace závislostí projektu
        run: npm install --legacy-peer-deps

      - name: 7. Sestavení webové aplikace (Vite)
        run: npm run build

      - name: 8. Synchronizace s nativním Android projektem (Capacitor)
        run: npx cap sync android

      - name: 9. Nastavení spustitelnosti pro Gradle
        run: chmod +x android/gradlew

      - name: 10. Sestavení nativního Android APK balíčku (Gradle)
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 11. Přejmenování APK na verzi s číslem sestavení
        run: |
          BUILD_NUM=$(( ${{ github.run_number }} + 5 ))
          cp android/app/build/outputs/apk/debug/app-debug.apk "WackyChess-v1.0.${BUILD_NUM}.apk"
          echo "RELEASE_VERSION=1.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: 12. Uložení APK jako stahovatelného artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: WackyChess-v${{ env.RELEASE_VERSION }}
          path: WackyChess-v*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 13. Automatické publikování GitHub Release s novým APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Wacky Chess Mayhem v${{ env.RELEASE_VERSION }}
          body: |
            🎉 Nové automatické sestavení hry **Wacky Chess Mayhem 3D**!
            
            - **Verze:** `${{ env.RELEASE_VERSION }}`
            - **Build:** `${{ github.run_number }}`
            - **Co je nového:** Automatická detekce aktualizací z GitHubu, opravená AI, plně funkční bonusy a pasti, české dabované hlášky postaviček a modernizovaná 3D grafika.
            - **Instalační balíček:** Stáhněte přiložený soubor `.apk` přímo v aplikaci nebo níže.
          files: WackyChess-v*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
